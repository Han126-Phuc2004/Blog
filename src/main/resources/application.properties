# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/blog_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Binhtung02@

# ===============================
# JPA / HIBERNATE
# ===============================
# ddl-auto: update = Tự động cập nhật schema khi có thay đổi entity
# Trong production nên dùng: none hoặc validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# SERVER CONFIG
# ===============================
server.port=8080
spring.application.name=blog-platform

# ===============================
# JWT CONFIGURATION
# ===============================
# Secret key để ký JWT token (256 bits = 32 characters)
# QUAN TRỌNG: Trong production, KHÔNG đặt secret key trong file này!
# Nên dùng environment variable hoặc secure vault (AWS Secrets Manager, Azure Key Vault, etc.)
jwt.secret=mySecretKeyForJWTAuthenticationBlog2024MustBe256BitsLongForHS256Algorithm

# Thời gian hết hạn của JWT token (milliseconds)
# 86400000 ms = 24 hours
# 3600000 ms = 1 hour
# 1800000 ms = 30 minutes
jwt.expiration=86400000
