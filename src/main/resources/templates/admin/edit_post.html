<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::pageCss}, ~{::content}, ~{::pageJs})}">

<th:block th:fragment="pageCss">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .form-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }
        .page-header {
            background: var(--hero-bg);
            color: white;
            padding: 1.5rem 0;
            margin-bottom: 2rem;
        }
    </style>
</th:block>

<div th:fragment="content">
    <div class="page-header">
        <div class="container">
            <h1 class="display-6 fw-bold mb-0">
                <i class="bi bi-pencil me-2"></i>Edit Post
            </h1>
        </div>
    </div>

    <div class="container pb-5">
        <div class="form-container">
            <!-- Error Message -->
            <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Error!</strong> Could not update post. Please check your inputs.
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Edit Post Form -->
            <form th:action="@{|/admin/posts/${post.postId}|}" method="post" th:object="${post}">
                <div class="mb-4">
                    <label for="title" class="form-label fw-bold">
                        <i class="bi bi-card-heading me-2"></i>Title <span class="text-danger">*</span>
                    </label>
                    <input type="text" 
                           id="title" 
                           name="title" 
                           class="form-control form-control-lg" 
                           placeholder="Enter post title..."
                           th:field="*{title}"
                           required>
                    <div class="form-text">A catchy title will attract more readers!</div>
                </div>

                <div class="mb-4">
                    <label for="thumbnailUrl" class="form-label fw-bold">
                        <i class="bi bi-image me-2"></i>Thumbnail URL
                    </label>
                    <input type="url" 
                           id="thumbnailUrl" 
                           name="thumbnailUrl" 
                           class="form-control" 
                           placeholder="https://example.com/image.jpg"
                           th:field="*{thumbnailUrl}">
                    <div class="form-text">Paste the URL of an image to use as thumbnail</div>
                </div>

                <div class="mb-4">
                    <label for="content" class="form-label fw-bold">
                        <i class="bi bi-card-text me-2"></i>Content <span class="text-danger">*</span>
                    </label>
                    <textarea id="content" 
                              name="content" 
                              class="form-control" 
                              rows="15" 
                              placeholder="Write your post content here..."
                              th:field="*{content}"
                              required></textarea>
                    <div class="form-text">Support HTML tags for formatting</div>
                </div>

                <div class="mb-4">
                    <label for="authorId" class="form-label fw-bold">
                        <i class="bi bi-person me-2"></i>Author <span class="text-danger">*</span>
                    </label>
                    <select id="authorId" 
                            name="authorId" 
                            class="form-select"
                            th:field="*{author.userId}"
                            required>
                        <option value="" disabled>-- Select Author --</option>
                        <option th:each="user : ${users}" 
                                th:value="${user.userId}" 
                                th:text="${user.fullName ?: user.username}"
                                th:selected="${user.userId == post.author.userId}">
                            User
                        </option>
                    </select>
                </div>

                <div class="alert alert-info">
                    <i class="bi bi-info-circle me-2"></i>
                    <strong>Post ID:</strong> <span th:text="${post.postId}">N/A</span>
                    <br>
                    <strong>Created:</strong> <span th:text="${#dates.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">N/A</span>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-primary px-5">
                        <i class="bi bi-check-circle me-1"></i>Update Post
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:fragment="pageJs">
    <script th:src="@{/js/main.js}"></script>
</th:block>

</html>
