<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (pageCss, content, pageJs)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Sophia Ellis Blog'">Sophia Ellis Blog</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Global CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/css/layout.css}" rel="stylesheet">
    <link th:href="@{/css/nav.css}" rel="stylesheet">
    <link th:href="@{/css/footer.css}" rel="stylesheet">

    <!-- Page-specific CSS -->
    <th:block th:replace="${pageCss}"></th:block>
</head>

<body class="d-flex flex-column min-vh-100">

<!-- HEADER -->
<header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">Sophia Ellis®</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/blog}">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contact}">Contact</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="#" class="text-decoration-none text-dark"><i class="bi bi-instagram fs-5"></i></a>
                    <a href="#" class="text-decoration-none text-dark"><i class="bi bi-facebook fs-5"></i></a>
                    <a href="#" class="text-decoration-none text-dark"><i class="bi bi-linkedin fs-5"></i></a>
                    <a href="#" class="text-decoration-none text-dark"><i class="bi bi-pinterest fs-5"></i></a>
                    <a th:href="@{/admin/dashboard}" class="btn btn-primary btn-sm">Dashboard</a>
                    <a href="#" class="btn btn-outline-dark btn-sm">SUBSCRIBE</a>
                </div>
            </div>
        </div>
    </nav>
</header>

<!-- MAIN CONTENT -->
<main class="flex-grow-1" th:replace="${content}">
    <section class="container py-5 text-center">
        <h2 class="fw-bold">Default Content</h2>
        <p class="text-muted">This is the default content area from layout.html</p>
    </section>
</main>

<!-- FOOTER -->
<footer class="bg-light py-4 mt-auto">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6">
                <p class="mb-0">Sophia Ellis®</p>
            </div>
            <div class="col-md-6 text-md-end">
                <ul class="list-inline mb-0">
                    <li class="list-inline-item"><a class="text-decoration-none text-dark" th:href="@{/}">Home</a></li>
                    <li class="list-inline-item"><a class="text-decoration-none text-dark" th:href="@{/blog}">Blog</a></li>
                    <li class="list-inline-item"><a class="text-decoration-none text-dark" th:href="@{/about}">About</a></li>
                    <li class="list-inline-item"><a class="text-decoration-none text-dark" th:href="@{/contact}">Contact</a></li>
                </ul>
                <div class="mt-2">
                    <a href="#" class="text-decoration-none text-dark me-3"><i class="bi bi-instagram"></i></a>
                    <a href="#" class="text-decoration-none text-dark me-3"><i class="bi bi-facebook"></i></a>
                    <a href="#" class="text-decoration-none text-dark me-3"><i class="bi bi-linkedin"></i></a>
                    <a href="#" class="text-decoration-none text-dark"><i class="bi bi-pinterest"></i></a>
                </div>
            </div>
        </div>
    </div>
</footer>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<th:block th:replace="${pageJs}"></th:block>

</body>
</html>
